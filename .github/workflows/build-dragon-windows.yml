name: Build DRAGON Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "public/**"
      - ".github/workflows/build-dragon-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download bundled OmniGet runtime
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\desktop\scripts\fetch-tools.ps1

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build DRAGON installer
        working-directory: desktop
        run: npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DRAGON-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
