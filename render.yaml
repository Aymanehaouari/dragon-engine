services:
  - type: web
    name: dragon-omniget-engine
    runtime: docker
    dockerfilePath: ./omniget-web/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OMNIGET_WEB_TOKEN
        generateValue: true
      - key: OMNIGET_ALLOWED_HOSTS
        sync: false
      - key: MAX_FILE_BYTES
        value: "262144000"
      - key: JOB_TTL_SECONDS
        value: "1800"
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: "600"
